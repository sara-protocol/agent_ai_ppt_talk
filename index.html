<script>
// i18n
const I18N = {
  'zh': {
    voice_label:'语音:', speak:'朗读', pay_title:'确认充值信息', pay_sub:'支持 USDT (ERC20) 扫码支付，支付后自动解锁 Pro', close:'关闭', paid:'我已付款', pay_tip:'* 付款后点击“我已付款”，系统将校验链上交易并解锁 Pro 会员（测试环境直接解锁）',
    free_preview:'免费预览', locked:'需解锁', unlock_star:'⭐ Star解锁', pro_download:'👑 Pro 一键打包'
  },
  'en': {
    voice_label:'Voice:', speak:'Speak', pay_title:'Confirm Payment', pay_sub:'USDT (ERC20) QR payment, auto unlock Pro after payment', close:'Close', paid:'I Paid', pay_tip:'* After payment click "I Paid", system verifies on-chain tx and unlocks Pro (demo unlocks directly)',
    free_preview:'Free Preview', locked:'Locked', unlock_star:'⭐ Unlock with Star', pro_download:'👑 Pro Download'
  }
};
let curLang = localStorage.getItem('ppt_lang')||'zh';
function applyLang(l){
  curLang=l; localStorage.setItem('ppt_lang', l);
  document.getElementById('lang-zh').className = l==='zh'?'active':'';
  document.getElementById('lang-en').className = l==='en'?'active':'';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(I18N[l][k]) el.textContent=I18N[l][k];
  });
}
document.getElementById('lang-zh').onclick=()=>applyLang('zh');
document.getElementById('lang-en').onclick=()=>applyLang('en');
applyLang(curLang);

// TTS voice switch
let voices=[];
function loadVoices(){ voices=speechSynthesis.getVoices(); }
speechSynthesis.onvoiceschanged=loadVoices; loadVoices();
function getVoiceByLang(l){
  const v = voices.find(v=>v.lang.toLowerCase().includes(l.toLowerCase())) || voices.find(v=>v.lang.toLowerCase().includes('zh')) || voices[0];
  return v;
}
document.getElementById('btn-speak').onclick=()=>{
  speechSynthesis.cancel();
  const langSel=document.getElementById('voice-lang').value;
  const text = document.querySelector('h1,h2') ? Array.from(document.querySelectorAll('h1,h2')).slice(0,3).map(h=>h.textContent).join('。') : (curLang==='zh'?'Agent AI 从80页综述到2026实战，基于MCP和A2A标准':'Agent AI from 80-page survey to 2026 MCP A2A practice');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang=langSel;
  const v=getVoiceByLang(langSel);
  if(v) utter.voice=v;
  utter.rate=0.95;
  speechSynthesis.speak(utter);
};
document.getElementById('btn-stop').onclick=()=>speechSynthesis.cancel();
document.getElementById('voice-lang').onchange=()=>{
  curLang = document.getElementById('voice-lang').value.includes('zh')?'zh':'en';
  applyLang(curLang);
};

// USDT Pay Modal
const modal=document.getElementById('pay-modal');
document.getElementById('btn-pay').onclick=()=>modal.classList.add('show');
document.getElementById('pay-close').onclick=()=>modal.classList.remove('show');
modal.onclick=(e)=>{ if(e.target===modal) modal.classList.remove('show'); };
document.getElementById('copy-addr').onclick=()=>{
  navigator.clipboard.writeText(document.getElementById('usdt-addr').textContent.trim()).then(()=>{
    const b=document.getElementById('copy-addr'); const o=b.textContent; b.textContent='✅ Copied'; setTimeout(()=>b.textContent=o,1500);
  });
};
document.getElementById('pay-done').onclick=()=>{
  localStorage.setItem('isProMember','true');
  localStorage.setItem('paid_usdt','0x05761494aff51283651a373920470c53dd4954b5');
  alert(curLang==='zh'?'✅ 已记录付款，Pro会员已解锁！刷新后可一键打包下载':'✅ Payment recorded, Pro unlocked! Refresh to download package');
  modal.classList.remove('show');
  location.reload();
};

// Hook existing membership bar texts for i18n
setTimeout(()=>{
  const st=document.getElementById('mem-status');
  if(st){ 
    const orig=st.textContent;
    // will be overwritten by membership.js but we translate via observer
  }
},1000);
</script>
